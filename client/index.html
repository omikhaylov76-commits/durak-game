<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#140f18">
<title>Дурак — тёплый вечер (сеть)</title>
<!-- =====================================================================
   КАК РАЗВЕРНУТЬ БЕСПЛАТНО (один файл = весь проект, бэкенд не нужен:
   сеть работает через публичные MQTT-брокеры по WSS):
   1) Netlify Drop — самый простой: откройте netlify.com и перетащите файл
      (или папку с index.html) в окно — ссылка появится сразу, аккаунт для
      старта не обязателен [[9]].
   2) GitHub Pages — создайте репозиторий, положите файл как index.html в
      корень, включите Pages в настройках — бесплатно для статических
      сайтов [[2]].
   3) Surge.sh — публикация статики бесплатно из командной строки [[8]].
   4) Vercel — импорт репозитория или drag-and-drop, бесплатный тариф [[12]].
   ИГРА ПО СЕТИ: вы и ребёнок/друзья открываете одну и ту же ссылку;
   один жмёт «Создать комнату» (выберите 2 игрока) и диктует 5-значный код;
   остальные «Войти по коду» — и вы за одним столом из разных городов.
   ===================================================================== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/rubik@5.0.20/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/rubik@5.0.20/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/rubik@5.0.20/900.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/pt-serif@5.0.20/700.css">
<style>
:root{--ease:cubic-bezier(.22,.85,.26,1.08);--dur:320ms}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#24352c;font-family:Rubik,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
button{font-family:Rubik,system-ui,sans-serif}
#bg{position:fixed;inset:-24px;z-index:0;background-color:#3A5A4C;transition:transform .5s ease-out;will-change:transform}
#lamp{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 62% 46% at 50% 44%, rgba(255,196,120,.15), rgba(255,184,107,.05) 55%, transparent 78%)}
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 95% 85% at 50% 46%, transparent 55%, rgba(10,16,11,.62) 100%)}
#game{position:fixed;inset:0;z-index:3}
#seats{position:absolute;inset:0;z-index:5;pointer-events:none}
#cards{position:absolute;inset:0;z-index:7}
#deckzone,#bitozone{position:absolute;inset:0;pointer-events:none}
#deckzone{z-index:8}#bitozone{z-index:6}
#deckstack,#bitostack{position:absolute;transform:translate(-50%,-50%);border-radius:8px;background:#5C3A2E center/cover}
#deckstack{box-shadow:2px 2px 0 #4a2e24,4px 4px 0 #4a2e24,6px 6px 14px rgba(15,20,15,.7)}
#bitostack{opacity:.55;filter:brightness(.85);box-shadow:0 14px 18px -6px rgba(15,20,15,.65)}
#deckcount,#bitocount,#trumpchip{position:absolute;transform:translate(-50%,-50%)}
#deckcount{min-width:36px;height:36px;border-radius:18px;padding:0 6px;display:flex;align-items:center;justify-content:center;background:#D8A86B;color:#241a10;font-weight:900;font-size:16px;border:2px solid rgba(60,40,20,.55);box-shadow:0 4px 10px -3px rgba(0,0,0,.7)}
#trumpchip{min-width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;
 background:rgba(20,26,20,.8);border:2px solid rgba(176,141,87,.55);box-shadow:0 4px 10px -3px rgba(0,0,0,.7);font-size:22px;font-weight:900}
#deckcount.bump{animation:bump .45s var(--ease)}
@keyframes bump{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}
.card{position:absolute;left:0;top:0;will-change:transform;transform-origin:center;transition:transform var(--dur) var(--ease), width .28s ease, height .28s ease}
.card::after{content:'';position:absolute;inset:-8px}
.card.ghost{pointer-events:none}.card.ghost::after{display:none}
.noanim .card,.noanim .lift,.noanim .flip{transition:none!important}
.lift{width:100%;height:100%;transition:transform .2s var(--ease)}
.card.hover .lift,.card.sel .lift{transform:translateY(-24px) scale(1.06)}
.card.nudge-l .lift{transform:translateX(-10px)}
.card.nudge-r .lift{transform:translateX(10px)}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .28s cubic-bezier(.3,.9,.3,1)}
.card.back .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7px;overflow:hidden;box-shadow:0 12px 14px -6px rgba(15,20,15,.6),0 2px 4px rgba(15,20,15,.4)}
.face.front{background:#F6EFE2}
.face.front svg,.face.backf svg{display:block;width:100%;height:100%}
.face.backf{transform:rotateY(180deg);background:#5C3A2E}
.card.dim .face{filter:brightness(.58) saturate(.75)}
.card.playable{cursor:pointer}
.card.playable .face.front{box-shadow:0 12px 14px -6px rgba(15,20,15,.6),0 0 0 2px rgba(255,207,107,.55)}
.card.sel .face.front{box-shadow:0 0 0 3px #FFD98A,0 16px 20px -6px rgba(15,20,15,.7)}
.card.target .face.front{box-shadow:0 0 0 3px #FFCF6B,0 12px 18px -6px rgba(15,20,15,.6);animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.14)}}
.card.shake .lift{animation:wobble .32s}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) translateX(-5px)}75%{transform:rotate(4deg) translateX(5px)}}
.seat{position:absolute;transform:translate(-50%,-50%)}
.seat.top{width:240px;height:252px}
.seat.left,.seat.right{width:212px;height:250px}
.fanrot{position:absolute}
.fan2{position:absolute;left:50%;top:50%;width:236px;height:156px;transform:translate(-50%,-50%)}
.fanrot.rotL .fan2{transform:translate(-50%,-50%) rotate(90deg)}
.fanrot.rotR .fan2{transform:translate(-50%,-50%) rotate(-90deg)}
.seat.top .fanrot{left:50%;top:0;width:236px;height:156px;margin-left:-118px}
.seat.left .fanrot{left:42px;top:50%;width:156px;height:236px;margin-top:-118px}
.seat.right .fanrot{right:42px;top:50%;width:156px;height:236px;margin-top:-118px}
.mini2{position:absolute;left:50%;bottom:2px;width:96px;height:137px;transform-origin:50% 100%;border-radius:8px;background:var(--backbg) center/cover;border:1px solid rgba(176,141,87,.45);box-shadow:0 6px 10px -3px rgba(15,20,15,.6)}
.seat .avatar{position:absolute;z-index:2;width:98px;height:98px;border-radius:50%;background-size:cover,cover;border:3px solid rgba(176,141,87,.75);box-shadow:0 8px 18px -5px rgba(0,0,0,.75), 0 0 0 4px rgba(20,26,20,.35);transition:box-shadow .3s}
.seat.top .avatar{left:50%;top:106px;transform:translateX(-50%)}
.seat.left .avatar{left:42px;top:50%;transform:translate(-50%,-50%)}
.seat.right .avatar{right:42px;top:50%;transform:translate(50%,-50%)}
.seat .avatar.ping{animation:ping .8s var(--ease)}
@keyframes ping{0%{box-shadow:0 8px 18px -5px rgba(0,0,0,.75),0 0 0 0 rgba(255,184,107,.85)}100%{box-shadow:0 8px 18px -5px rgba(0,0,0,.75),0 0 0 26px rgba(255,184,107,0)}}
.seat .avatar .badge{position:absolute;top:-7px;right:-11px;min-width:28px;height:28px;padding:0 7px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#D8A86B;color:#241a10;font-weight:900;font-size:15px;border:2px solid rgba(60,40,20,.55);box-shadow:0 4px 8px -2px rgba(15,20,15,.6);z-index:2}
.seat .aname{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(16,22,17,.8);color:#F6EBD4;font-weight:800;font-size:13px;padding:2px 11px;border-radius:10px;white-space:nowrap;max-width:92px;overflow:hidden;text-overflow:ellipsis}
.seat.turn .avatar{box-shadow:0 8px 18px -5px rgba(0,0,0,.75),0 0 0 4px rgba(255,184,107,.4),0 0 22px 4px rgba(255,184,107,.55)}
.seat.turn .badge{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 14px 3px rgba(255,184,107,.75)}}
.seat.out{opacity:.45;filter:grayscale(.6)}
.seat .rolechip{position:absolute;font-size:12px;font-weight:800;color:#FFD9A0;background:rgba(20,26,20,.78);border:1px solid rgba(176,141,87,.4);border-radius:10px;padding:3px 10px;letter-spacing:.3px}
.seat .rolechip.atk{background:linear-gradient(180deg,#E7B877,#B98A4E);color:#241a10;border:1px solid rgba(60,40,20,.5);animation:chipPulse 1.2s ease-in-out infinite}
.seat .rolechip.def{background:linear-gradient(180deg,#DE8A63,#AE5A3C);color:#fff;border:1px solid rgba(60,40,20,.5);animation:chipPulse 1.2s ease-in-out infinite}
@keyframes chipPulse{50%{box-shadow:0 0 14px 3px rgba(255,184,107,.55)}}
.seat.top .rolechip{left:50%;top:212px;transform:translateX(-50%)}
.seat.left .rolechip{left:42px;top:calc(50% + 58px);transform:translateX(-50%)}
.seat.right .rolechip{right:42px;top:calc(50% + 58px);transform:translateX(50%)}
.chip{background:rgba(20,26,20,.78);border:1px solid rgba(176,141,87,.4);color:#F2E7D0;padding:8px 16px;border-radius:14px;font-weight:700;font-size:15px;backdrop-filter:blur(6px);white-space:nowrap}
#hud{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:20}
#status{display:flex;align-items:center;gap:10px;padding:12px 24px;border-radius:18px;font-size:17px;white-space:nowrap;
 background:linear-gradient(180deg,rgba(46,35,52,.94),rgba(28,21,36,.94));
 border:1px solid rgba(255,184,107,.55);
 box-shadow:0 12px 32px -8px rgba(0,0,0,.75),0 0 0 4px rgba(255,184,107,.12), inset 0 1px 0 rgba(255,255,255,.08);
 backdrop-filter:blur(8px)}
#status .who{color:#FFD9A0;font-weight:900}
#status .act{color:#F2E7D0;font-weight:600}
#status .dots{display:inline-flex;gap:4px;margin-left:2px}
#status .dots i{width:6px;height:6px;border-radius:50%;background:#FFB86B;animation:dot 1s infinite}
#status .dots i:nth-child(2){animation-delay:.15s}
#status .dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
#status.pop{animation:statusPop .32s var(--ease)}
@keyframes statusPop{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1);opacity:1}}
#timer{width:38px;height:38px;border-radius:50%;position:relative;display:none;background:conic-gradient(#FFB86B var(--p,100%), rgba(255,255,255,.14) 0)}
#timer span{position:absolute;inset:5px;border-radius:50%;background:#1A1524;color:#FFD9A0;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
#toasts{position:absolute;top:19%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:22;pointer-events:none}
.toast{background:rgba(20,26,20,.88);border:1px solid rgba(255,184,107,.5);color:#FFE3B8;padding:10px 22px;border-radius:16px;font-weight:900;font-size:17px;animation:toast 2.2s forwards;box-shadow:0 10px 24px -8px rgba(0,0,0,.7)}
@keyframes toast{0%{opacity:0;transform:translateY(14px) scale(.9)}12%{opacity:1;transform:translateY(0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#actions{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:30}
.btn{min-height:56px;padding:0 30px;border-radius:16px;border:1px solid rgba(60,40,20,.65);cursor:pointer;background:linear-gradient(180deg,#D8A86B,#A87C48);color:#2A1C10;font-weight:900;font-size:18px;box-shadow:0 8px 16px -6px rgba(15,20,15,.8);transition:transform .15s var(--ease), box-shadow .15s, filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px) scale(.97)}
.btn.warn{background:linear-gradient(180deg,#DE8A63,#AE5A3C);color:#fff}
.btn.ghost{background:rgba(20,26,20,.6);color:#F2E7D0;border-color:rgba(176,141,87,.5)}
.btn.big{width:100%;margin-top:18px}
.chip-btn{position:absolute;z-index:31;bottom:12px;background:rgba(20,26,20,.78);border:1px solid rgba(176,141,87,.4);color:#F2E7D0;border-radius:12px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;backdrop-filter:blur(6px);transition:transform .15s var(--ease), filter .15s}
.chip-btn:hover{filter:brightness(1.15)}
.chip-btn:active{transform:scale(.94)}
#sortbtn{left:12px}#menubtn{right:12px}
#emoBtn{right:86px;font-size:20px;padding:8px 12px}
#emoPanel{position:absolute;right:12px;bottom:64px;z-index:40;display:grid;grid-template-columns:repeat(4,54px);gap:6px;background:rgba(20,26,20,.9);border:1px solid rgba(176,141,87,.4);border-radius:18px;padding:10px;backdrop-filter:blur(6px);box-shadow:0 16px 40px -12px rgba(0,0,0,.8);animation:panelIn .22s var(--ease)}
@keyframes panelIn{0%{opacity:0;transform:translateY(10px) scale(.92)}100%{opacity:1;transform:none}}
#emoPanel.hidden{display:none}
#emoPanel button{font-size:30px;line-height:1.2;background:rgba(255,255,255,.06);border:1px solid rgba(176,141,87,.25);border-radius:12px;padding:7px 4px;cursor:pointer;transition:transform .12s var(--ease), background .12s}
#emoPanel button:hover{background:rgba(255,255,255,.12);transform:scale(1.12)}
#emoPanel button:active{transform:scale(1.28)}
.reaction{position:absolute;z-index:46;font-size:88px;pointer-events:none;transform:translate(-50%,-50%);text-shadow:0 8px 22px rgba(0,0,0,.55);animation:react 1.8s cubic-bezier(.2,.8,.3,1) forwards}
.reaction .rname{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:2px;font:800 13px Rubik;color:#FFE3B8;background:rgba(20,26,20,.8);padding:2px 10px;border-radius:9px;white-space:nowrap}
@keyframes react{0%{opacity:0;transform:translate(-50%,-40%) scale(.2) rotate(-14deg);filter:blur(4px)}12%{opacity:1;transform:translate(-50%,-58%) scale(1.28) rotate(5deg);filter:blur(0)}24%{transform:translate(-50%,-64%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-210%) scale(1.05);filter:blur(2px)}}
#handTag{position:absolute;z-index:31;bottom:48px;left:12px;font-size:13px;padding:6px 12px}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,14,10,.62);backdrop-filter:blur(8px);animation:fadeIn .25s ease}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
.overlay.hidden{display:none}
.panel{background:linear-gradient(180deg,#2A2130,#1E1724);border:1px solid rgba(176,141,87,.45);border-radius:22px;padding:30px 36px;color:#F2E7D0;width:min(92vw,560px);max-height:92vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.85);animation:popIn .32s var(--ease)}
@keyframes popIn{0%{opacity:0;transform:scale(.92) translateY(14px)}100%{opacity:1;transform:none}}
.panel h1{font-family:'PT Serif',Georgia,serif;font-size:44px;color:#FFD9A0;text-align:center}
.panel h2{font-family:'PT Serif',Georgia,serif;font-size:30px;color:#FFD9A0;text-align:center;margin-bottom:8px}
.panel .sub{text-align:center;color:#C9B8A0;margin:6px 0 18px;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:12px 0;font-weight:700}
.seg{display:flex;gap:6px}
.seg button{padding:9px 16px;border-radius:11px;border:1px solid rgba(176,141,87,.4);background:rgba(26,21,36,.5);color:#D9C9A8;font-weight:700;cursor:pointer;transition:all .15s var(--ease)}
.seg button.on{background:#D8A86B;color:#241a10;border-color:#D8A86B;transform:scale(1.05)}
.check{display:flex;gap:10px;align-items:center;margin:14px 0;font-weight:700;cursor:pointer}
.check input{width:20px;height:20px;accent-color:#D8A86B}
input[type=range]{width:170px;accent-color:#D8A86B}
.rowc{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.center{text-align:center}
.nameinp{background:rgba(26,21,36,.5);border:1px solid rgba(176,141,87,.4);color:#F2E7D0;border-radius:11px;padding:9px 12px;font-weight:700;font-size:15px;width:170px;outline:none}
.codeinp{letter-spacing:4px;text-transform:uppercase;width:130px;text-align:center}
.roomcode{font-family:'PT Serif',Georgia,serif;font-size:40px;letter-spacing:10px;color:#FFD9A0;text-align:center;margin:8px 0}
#roomSeats{display:flex;flex-direction:column;gap:6px;margin:10px 0}
#roomSeats .rs{display:flex;justify-content:space-between;background:rgba(26,21,36,.4);border-radius:10px;padding:7px 12px;font-size:14px}
#roomSeats .rs b{color:#FFD9A0}
.netnote{font-size:12.5px;color:#C9B8A0;text-align:center;margin-top:10px}
.hidden{display:none!important}
@media (max-width:760px){
 .panel{padding:22px 20px}.panel h1{font-size:34px}#handTag{display:none}.btn{padding:0 20px;font-size:16px}
 #status{font-size:14px;padding:10px 16px}
 .seat.top{width:176px;height:190px}.seat.left,.seat.right{width:160px;height:190px}
 .seat.top .fanrot{margin-left:-84px;width:168px;height:116px}
 .seat.left .fanrot,.seat.right .fanrot{width:116px;height:168px;margin-top:-84px}
 .seat.left .fanrot{left:32px}.seat.right .fanrot{right:32px}
 .fan2{width:168px;height:116px}.mini2{width:67px;height:96px}
 .seat .avatar{width:64px;height:64px}
 .seat.top .avatar{top:72px}.seat.left .avatar{left:32px}.seat.right .avatar{right:32px}
 .seat .aname{font-size:10px;bottom:5px;padding:1px 8px;max-width:58px}
 .seat .avatar .badge{min-width:22px;height:22px;font-size:12px;top:-5px;right:-8px}
 .seat.top .rolechip{top:142px}.seat.left .rolechip{top:calc(50% + 42px)}.seat.right .rolechip{top:calc(50% + 42px)}
 #emoPanel{grid-template-columns:repeat(4,46px)}#emoPanel button{font-size:24px}.reaction{font-size:64px}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="lamp"></div>
<div id="vignette"></div>
<audio id="music" loop preload="none"></audio>
<div id="game">
  <div id="seats"></div>
  <div id="bitozone"><div id="bitostack"></div><div id="bitocount" class="chip">Бито: 0</div></div>
  <div id="cards"></div>
  <div id="deckzone"><div id="deckstack"></div><div id="deckcount" title="Карт в колоде">0</div><div id="trumpchip" title="Козырь" style="display:none"></div></div>
  <div id="hud"><div id="status">Ждём игроков…</div><div id="timer"><span>30</span></div></div>
  <div id="toasts"></div>
  <div id="actions"></div>
  <div id="handTag" class="chip"></div>
  <button id="sortbtn" class="chip-btn">⇅ Сортировка</button>
  <button id="emoBtn" class="chip-btn" title="Эмоции">😊</button>
  <div id="emoPanel" class="hidden"></div>
  <button id="menubtn" class="chip-btn">Меню</button>
</div>
<div id="lobby" class="overlay">
  <div class="panel">
    <h1>Дурак</h1>
    <p class="sub">тёплый вечер, лампа и колода — садитесь к столу</p>
    <div class="row"><span>Ваше имя</span><input id="myName" class="nameinp" value="Игрок" maxlength="12"></div>
    <div class="row"><span>Игроки</span><div class="seg" id="optCount"><button data-v="2">2</button><button data-v="3" class="on">3</button><button data-v="4">4</button></div></div>
    <div class="row"><span>Колода</span><div class="seg" id="optDeck"><button data-v="36" class="on">36</button><button data-v="52">52</button></div></div>
    <div class="row"><span>Подкидывать</span><div class="seg" id="optThrow"><button data-v="all" class="on">все</button><button data-v="nb">соседи</button></div></div>
    <label class="check"><input type="checkbox" id="optFirst5"> первый кон — максимум 5 пар</label>
    <button id="startBtn" class="btn big">Сесть за стол (с ботами)</button>
    <div class="rowc">
      <button id="createBtn" class="btn ghost">Создать комнату</button>
      <button id="joinBtn" class="btn ghost">Войти по коду</button>
    </div>
    <div id="roomBox" class="hidden">
      <div class="roomcode" id="roomCode"></div>
      <div id="roomSeats"></div>
      <div id="joinRow" class="row hidden"><span>Код комнаты</span><input id="joinCode" class="nameinp codeinp" maxlength="5" placeholder="ABCDE"></div>
      <p id="netHint" class="sub"></p>

 var W=L.W,handW=L.handW,handH=L.handH,handY=L.handY;
 var ov=n>8?0.58:0.45;var w=Math.min(handW,W*0.96/(1+(n-1)*(1-ov)));
 while(w<handW*0.6&&ov<0.66){ov+=0.03;w=Math.min(handW,W*0.96/(1+(n-1)*(1-ov)));}
 var gap=w*0.22,gaps=0,i;for(i=1;i<n;i++)if(isTrump(hand[i])&&!isTrump(hand[i-1]))gaps++;
 var total=w*(1+(n-1)*(1-ov))+gaps*gap;var x=(W-total)/2+w/2;
 var mid=(n-1)/2,step=Math.min(3,16/n),out=[];
 for(i=0;i<n;i++){if(i>0){x+=w*(1-ov);if(isTrump(hand[i])&&!isTrump(hand[i-1]))x+=gap;}

 try{el.getAnimations&&el.getAnimations().forEach(function(a){a.cancel();});}catch(_){}
 if(el._flyTO){clearTimeout(el._flyTO);el._flyTO=0;}

 function finish(){ if(el._flyGen!==gen)return; el._flyTO=0;
  el.style.transition='';
  place(el,to.x,to.y,to.w,to.h,to.rot||0,to.z||el.dataset.baseZ,to.back);
  if(cb)cb(); }
 var mid={x:(f.x+to.x)/2,y:Math.min(f.y,to.y)-(arc||70),r:((f.r+(to.rot||0))/2)+7};
 var kf=[{transform:trStr(f.x,f.y,f.w,f.h,f.r),width:f.w+'px',height:f.h+'px'},
  {transform:trStr(mid.x,mid.y,(f.w+to.w)/2,(f.h+to.h)/2,mid.r),offset:.55},
  {transform:trStr(to.x,to.y,to.w,to.h,to.rot||0),width:to.w+'px',height:to.h+'px'}];

function cancelWait(){var w=G.wait;if(w){G.wait=null;stopTimer();if(NET.mode!=='guest')w.resolve(null);}}
function onCardClick(card){
 if(!G.running&&NET.mode!=='guest')return;
 if(now()<G.lockUntil)return;
 for(var i=0;i<G.table.length;i++)if(G.table[i].attack===card||G.table[i].defense===card)return;
 if(G.discard.indexOf(card)>=0)return;
 var w=G.wait;
 if(!w||w.idx!==0){shake(card);return;}
 if(w.type==='defend'){
  var pend=pendingAttack();
  if(pend&&canBeat(card,pend,G.trumpSuit))resolveWait({card:card});
  else{shake(card);AU.play('error');
   toast(pend&&pend.suit===G.trumpSuit?'Козырь бьётся только старшим козырем!':'Не бьёт: нужна старшая '+pend.suit+' или козырь');}}
 else{
  if(w.valid.has(card.id))resolveWait({card:card});
  else{shake(card);AU.play('error');}}}
function shake(card){var el=els.get(card.id);if(!el)return;
 el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');
 setTimeout(function(){el.classList.remove('shake');},360);}
function askHuman(idx,type){var p=G.players[idx],valid=null;beat();
 if(type==='attack'){valid=new Set();for(var i=0;i<p.hand.length;i++)valid.add(p.hand[i].id);}
 if(type==='throw'){valid=new Set();var ranks=ranksOnTable(G.table);
  for(var k=0;k<p.hand.length;k++)if(ranks.has(p.hand[k].rank))valid.add(p.hand[k].id);
  if(!valid.size&&!p.net){toast('Подкинуть нечем');return new Promise(function(res){setTimeout(function(){res(null);},450);});}}
 return new Promise(function(res){G.wait={idx:idx,type:type,valid:valid,resolve:res};startTimer();sync();});}
function thinkMs(){var q=G.quickNext;G.quickNext=false;
 return q?rnd(250,450):(S.fast?rnd(150,250):rnd(600,1100));}
function askPlayer(idx,type){G.turnIdx=idx;beat();sync();
 var p=G.players[idx];
 if(!p.bot)return askHuman(idx,type);
 return sleep(thinkMs()).then(function(){
  if(!G.running)return null;
  if(type==='attack')return{card:botPickAttack(p.hand,G.trumpSuit)};
  if(type==='throw'){var c=botPickThrow(p.hand,ranksOnTable(G.table),G.trumpSuit,G.players[G.defenderIdx].hand.length,G.deck.length);return c?{card:c}:null;}
  var d=botPickDefense(p.hand,pendingAttack(),G.trumpSuit,G.deck.length,G.table.length);
  return d?{card:d}:{take:true};});}
function applyAttack(idx,card){var p=G.players[idx];beat();
 p.hand=p.hand.filter(function(c){return c.id!==card.id;});
 G.table.push({attack:card,defense:null});
 var ti=G.table.length-1,s=L.slots[ti];
 var el=ensureEl(card);
 if(idx!==0){var sp=L.seats[idx];place(el,sp.x,sp.y,L.tabW,L.tabH,0,800,false);}
 AU.play('place');if(idx===0)sortHand(p);
 var mine=idx===0;
 flyArc(el,{x:s.x,y:s.y,w:L.tabW,h:L.tabH,rot:0,z:mine?900:200+ti*2,back:false},
  flight()+(mine?150:110),mine?120:90,0,null);
 sync();seatPing(idx);}
function applyDefense(card){var di=G.defenderIdx,p=G.players[di];beat();
 p.hand=p.hand.filter(function(c){return c.id!==card.id;});
 var ti=-1;for(var i=0;i<G.table.length;i++)if(!G.table[i].defense){G.table[i].defense=card;ti=i;break;}
 var s=L.slots[Math.max(ti,0)];
 var el=ensureEl(card);
 if(di!==0){var sp=L.seats[di];place(el,sp.x,sp.y,L.tabW,L.tabH,0,800,false);}
 AU.play('place');if(di===0)sortHand(p);
 var mine=di===0;
 flyArc(el,{x:s.x+L.tabW*0.26,y:s.y+L.tabH*0.16,w:L.tabW,h:L.tabH,rot:4.5,z:mine?900:201+Math.max(ti,0)*2,back:false},
  flight()+(mine?150:110),mine?120:90,0,null);
 sync();seatPing(di);}
function applyTake(){var d=G.players[G.defenderIdx];beat();
 G.quickNext=true;
 var nxt=G.players[G.nextAttacker]?G.players[G.nextAttacker].name:'';
 toast(d.name+' берёт и пропускает ход — ходит '+nxt);
 AU.play('take');botReaction();
 var cards=[];for(var i=0;i<G.table.length;i++){cards.push(G.table[i].attack);if(G.table[i].defense)cards.push(G.table[i].defense);}
 var di=G.defenderIdx;
 if(di===0){
  d.hand=d.hand.concat(cards);sortHand(d);
  var hp=handPositions();
  cards.forEach(function(c,k){var el=ensureEl(c);var idx0=d.hand.indexOf(c);var p=hp[idx0];
   flyArc(el,{x:p.x,y:p.y,w:L.handW,h:L.handH,rot:p.rot,z:500+idx0,back:false},flight()+130,70,k*70,null);});
  G.table=[];sync();
  return sleep(flight()+cards.length*70+140);}
 cards.forEach(function(c,k){var el=els.get(c.id);if(!el)return;
  el.dataset.fading='1';
  var sp=L.seats[di];
  flyArc(el,{x:sp.x,y:sp.y,w:L.tabW,h:L.tabH,rot:90,z:800,back:true},flight()+110,50,k*70,function(){el.style.display='none';delete el.dataset.fading;});});
 d.hand=d.hand.concat(cards);G.table=[];sync();
 return sleep(flight()+cards.length*70+160);}
function applyBito(){
 toast('Бито! Ходит '+G.players[G.nextAttacker].name);
 AU.play('swish');botReaction();beat();
 var cards=[];for(var i=0;i<G.table.length;i++){cards.push(G.table[i].attack);if(G.table[i].defense)cards.push(G.table[i].defense);}
 for(var j=0;j<cards.length;j++)G.discard.push(cards[j]);
 G.table=[];
 cards.forEach(function(c,k){var el=els.get(c.id);if(!el)return;
  var di2=G.discard.indexOf(c);
  flyArc(el,{x:L.bito.x+((di2*7)%13)-6,y:L.bito.y+((di2*5)%9)-4,w:L.tabW,h:L.tabH,rot:(di2*13)%21-10,z:120+di2,back:false},flight()+110,60,k*90);});
 sync();
 return sleep(flight()+cards.length*90+240);}
function throwOrder(){var n=G.players.length,out=[];
 for(var k=0;k<n;k++){var idx=(G.attackerIdx+k)%n,p=G.players[idx];
  if(idx===G.defenderIdx||p.out||!p.hand.length)continue;
  if(!G.opts.throwAll){var nb=idx===G.attackerIdx||nextActiveIdxOf(G.players,idx)===G.defenderIdx||nextActiveIdxOf(G.players,G.defenderIdx)===idx;
   if(!nb)continue;}
  out.push(idx);}
 return out;}
function defendOnce(tk){return askPlayer(G.defenderIdx,'defend').then(function(res){
  if(tk!==curToken||!G.running)return true;
  if(!res||res.take){
   G.nextAttacker=nextActiveIdxOf(G.players,G.defenderIdx);
   if(G.nextAttacker<0)G.nextAttacker=G.defenderIdx;
   return applyTake().then(function(){return true;});}
  applyDefense(res.card);
  return sleep(flight()+120).then(function(){return false;});});}
function enterRound(tk){
 if(tk!==curToken||!G.running)return Promise.resolve(true);
 beat();
 if(!G.table.length){
  return askPlayer(G.attackerIdx,'attack').then(function(a1){
   if(tk!==curToken||!G.running)return true;
   if(!a1||!a1.card)return true;
   applyAttack(G.attackerIdx,a1.card);
   return sleep(flight()+120).then(function(){return afterAttack(tk);});});}
 if(pendingAttack())return afterAttack(tk);
 return throwLoop(tk);}
function afterAttack(tk){return defendOnce(tk).then(function(took){
 if(took)return false;return throwLoop(tk);});}
function throwLoop(tk){
 var order=throwOrder(),i=0,passes=0;
 function step(){
  if(!G.running||tk!==curToken)return Promise.resolve(true);
  beat();
  if(!canThrowMore()||passes>=order.length)return Promise.resolve(false);
  var idx=order[i%order.length];
  return askPlayer(idx,'throw').then(function(act){
   if(tk!==curToken||!G.running)return true;
   if(!act||!act.card){passes++;i++;return step();}
   passes=0;applyAttack(idx,act.card);
   return sleep(flight()+120).then(function(){return defendOnce(tk);}).then(function(took2){
    if(took2)return true;i++;return step();});});}
 return step().then(function(stop){
  if(stop)return true;
  G.nextAttacker=G.defenderIdx;
  return applyBito().then(function(){return false;});});}
function playRound(tk){
 G.defenderIdx=nextActiveIdxOf(G.players,G.attackerIdx);
 if(G.defenderIdx===G.attackerIdx||G.defenderIdx<0)G.defenderIdx=nextActiveIdxOf(G.players,G.attackerIdx);
 G.turnIdx=G.attackerIdx;G.table=[];sync();
 return enterRound(tk);}
function refill(){G.refilling=true;sync();
 var order=refillOrder(G.players,G.roundAttacker,G.defenderIdx);
 var chain=Promise.resolve();
 order.forEach(function(idx){chain=chain.then(function(){
  var p=G.players[idx];
  function drawOne(){
   if(p.hand.length>=6||!G.deck.length)return Promise.resolve();
   var c=G.deck.pop();if(c===G.trumpCard)G.trumpInDeck=false;
   p.hand.push(c);AU.play('draw');beat();
   if(idx===0){
    sortHand(p);
    var el=ensureEl(c);el.classList.add('back');
    place(el,L.deck.x,L.deck.y,L.handW,L.handH,0,800,true);
    var hpA=handPositions(),hp=hpA[p.hand.indexOf(c)];
    var dur=flight()+110;
    flyArc(el,{x:hp.x,y:hp.y,w:L.handW,h:L.handH,rot:hp.rot,z:500+p.hand.length,back:false},dur,60,0,null);
    sync();return sleep(dur+40).then(drawOne);}
   ghostDraw(idx);sync();
   return sleep(S.fast?50:110).then(drawOne);}
  return drawOne().then(function(){if(idx===0)sortHand(p);});});});
 return chain.then(function(){
  for(var pass=0;pass<2;pass++){
   for(var q=0;q<order.length;q++){
    var pl=G.players[order[q]];
    while(pl.hand.length<6&&G.deck.length){
     var c=G.deck.pop();if(c===G.trumpCard)G.trumpInDeck=false;
     pl.hand.push(c);
     if(order[q]===0)sortHand(pl);}}}
  G.refilling=false;sync();});}
function checkEnd(){ if(G.deck.length)return false;
 for(var i=0;i<G.players.length;i++)if(!G.players[i].hand.length)G.players[i].out=true;
 var alive=[];for(var k=0;k<G.players.length;k++)if(!G.players[k].out)alive.push(k);
 if(alive.length<=1){endGame(alive.length?alive[0]:null);return true;}
 return false;}
function showOver(fool){var t=$('#goTitle'),s=$('#goSub');
 if(fool===null){t.textContent='Ничья!';s.textContent='все вышли одновременно — бывает';AU.play('win');}
 else if(fool===0){t.textContent='Вы остались в дураках';s.textContent='ну, с кем не бывает… чаю?';AU.play('lose');}
 else{t.textContent='Дурак — '+G.players[fool].name;s.textContent='Вы вышли из партии сухим!';AU.play('win');}
 $('#gameover').classList.remove('hidden');}
function endGame(fool){G.running=false;G.over=fool;G.refilling=false;cancelWait();stopTimer();sync();showOver(fool);}
function roundDone(tk){
 return refill().then(function(){ if(tk!==curToken)return;
  if(checkEnd())return;
  var na=G.nextAttacker;
  if(na<0||G.players[na].out){na=nextActiveIdxOf(G.players,Math.max(na,0));if(na<0){checkEnd();return;}}
  G.attackerIdx=na;G.firstRound=false;
  return sleep(G.quickNext?100:(S.fast?150:350)).then(function(){gameLoopStep(tk);});
 }).catch(errCb);}
function gameLoopStep(tk){ if(!G.running||tk!==curToken)return;
 G.roundAttacker=G.attackerIdx;
 playRound(tk).then(function(stop){
  if(stop||tk!==curToken||!G.running)return;
  roundDone(tk);
 }).catch(errCb);}
function startGame(opts,playersArr){
 cancelWait();curToken++;var tk=curToken;
 G.running=true;G.opts=opts;G.turnIdx=-1;G.over=undefined;G.refilling=false;G.quickNext=false;lastDeckCount=-1;beat();
 $('#cards').innerHTML='';els.clear();
 $('#gameover').classList.add('hidden');$('#menu').classList.add('hidden');
 var names=['Китти','Мелоди','Кероппи'];
 G.players=playersArr||[{name:'Вы',bot:false,hand:[],out:false}];
 if(!playersArr)for(var i=1;i<opts.count;i++)G.players.push({name:names[i-1],bot:true,hand:[],out:false});
 G.allCards=buildDeck(opts.deck);G.deck=shuffleInPlace(G.allCards.slice());
 G.trumpCard=G.deck[0];G.trumpSuit=G.trumpCard.suit;G.trumpInDeck=true;
 G.discard=[];G.table=[];G.firstRound=true;
 for(var k=0;k<6;k++)for(var pi=0;pi<G.players.length;pi++)G.players[pi].hand.push(G.deck.pop());
 for(var q=0;q<G.players.length;q++)sortHand(G.players[q]);
 var first=0,best=99;
 G.players.forEach(function(p,ix){p.hand.forEach(function(c){if(c.suit===G.trumpSuit&&c.rank<best){best=c.rank;first=ix;}});});
 G.attackerIdx=first;
 computeLayout();
 $('#deckstack').style.backgroundImage=BACK_URI;
 $('#bitostack').style.backgroundImage=BACK_URI;
 sync();
 if(NET.mode==='host'){NET.started=true;NET.send({t:'start'});}
 dealAnim(tk).then(function(){ if(tk!==curToken)return;
  toast('Первым ходит '+G.players[first].name+' — младший козырь');
  gameLoopStep(tk);});}
function dealAnim(tk){AU.play('swish');
 var f=S.fast?0.5:1;var positions=handPositions();
 G.players[0].hand.forEach(function(c,i){
  var el=ensureEl(c);el.classList.add('back');
  place(el,L.deck.x,L.deck.y,L.handW,L.handH,0,800,true);
  var p=positions[i];var dur=400*f;
  flyArc(el,{x:p.x,y:p.y,w:L.handW,h:L.handH,rot:p.rot,z:500+i,back:false},dur,80,i*40*f,function(){el.classList.remove('back');});});
 sync();
 return sleep(6*40*f+400*f+160).then(function(){ if(tk!==curToken)return;sync();});}
function wireSeg(id,cb){var box=$('#'+id);
 box.querySelectorAll('button').forEach(function(b){b.onclick=function(){
  box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
  b.classList.add('on');cb(b.dataset.v);};});}
var optV={count:3,deck:36,throwAll:true};
wireSeg('optCount',function(v){optV.count=+v;renderRoom();});
wireSeg('optDeck',function(v){optV.deck=+v;});
wireSeg('optThrow',function(v){optV.throwAll=v==='all';});
function readOpts(){return {count:optV.count,deck:optV.deck,throwAll:optV.throwAll,first5:$('#optFirst5').checked};}
function renderRoom(){var box=$('#roomSeats');if(!box)return;box.innerHTML='';
 for(var i=0;i<optV.count;i++){var who='—';
  if(i===0)who=($('#myName').value||'Вы')+' (хост)';
  else for(var id in NET.peers)if(NET.peers[id].seat===i)who=NET.peers[id].name;
  var d=document.createElement('div');d.className='rs';
  d.innerHTML='<span>Место '+i+'</span><b>'+who+'</b>';box.appendChild(d);}}
$('#startBtn').onclick=function(){
 AU.init();if(AU.ctx&&AU.ctx.state==='suspended'){try{AU.ctx.resume();}catch(_){}}
 initMusic();NET.mode='off';
 $('#lobby').classList.add('hidden');
 startGame(readOpts(),null);};
$('#createBtn').onclick=function(){
 AU.init();initMusic();
 if(NET.mode!=='off')return;
 $('#createBtn').disabled=true;$('#createBtn').textContent='Подключение…';
 NET.connect(function(){
  NET.mode='host';
  NET.send({t:'create', count:optV.count, deck:optV.deck, name:$('#myName').value||'Хост'});
  setTimeout(function(){$('#createBtn').disabled=false;$('#createBtn').textContent='Создать комнату';},6000);});};
$('#joinBtn').onclick=function(){
 AU.init();initMusic();
 if(NET.mode!=='off')return;
 $('#roomBox').classList.remove('hidden');
 $('#roomCode').textContent='';
 $('#joinRow').classList.remove('hidden');$('#netGoBtn').classList.remove('hidden');
 $('#netStartBtn').classList.add('hidden');
 $('#netHint').textContent='Введите код комнаты из 6 символов.';
 $('#roomSeats').innerHTML='';};
$('#netGoBtn').onclick=function(){
 var code=($('#joinCode').value||'').trim().toUpperCase();
 if(code.length<5){toast('Код — 6 символов');return;}
 $('#netGoBtn').disabled=true;
 NET.connect(function(){
  NET.mode='guest';
  NET.send({t:'join', code:code, name:$('#myName').value||'Гость'});
  setTimeout(function(){$('#netGoBtn').disabled=false;},6000);});};
$('#netCancelBtn').onclick=function(){NET.leave();
 $('#roomBox').classList.add('hidden');$('#lobby').classList.remove('hidden');};
$('#netStartBtn').onclick=function(){
 if(NET.mode!=='host')return;
 var opts=readOpts();
 var names=['Китти','Мелоди','Кероппи'],bi=0,players=[{name:$('#myName').value||'Вы',bot:false,hand:[],out:false}];
 for(var i=1;i<opts.count;i++){var peer=NET.peers[i];
  if(peer)players.push({name:peer.name,bot:false,net:1,hand:[],out:false});
  else players.push({name:names[bi++%3],bot:true,hand:[],out:false});}
 $('#lobby').classList.add('hidden');
 startGame(opts,players);};
$('#menubtn').onclick=function(){
 $('#mFour').checked=S.four;$('#mFast').checked=S.fast;$('#mLarge').checked=S.large;
 $('#mAmb').value=Math.round(S.volAmb*100);$('#mCards').value=Math.round(S.volCards*100);
 $('#menu').classList.remove('hidden');};
$('#resumeBtn').onclick=function(){$('#menu').classList.add('hidden');};
$('#newBtn').onclick=function(){$('#menu').classList.add('hidden');if(NET.mode==='guest'){toast('Новую партию начинает хост');return;}startGame(G.opts,null);};
$('#toLobbyBtn').onclick=function(){cancelWait();curToken++;G.running=false;G.players=[];G.allCards=[];G.table=[];G.discard=[];
 $('#menu').classList.add('hidden');$('#cards').innerHTML='';els.clear();
 if(NET.mode!=='off')NET.leave();
 $('#lobby').classList.remove('hidden');};
$('#againBtn').onclick=function(){ if(NET.mode==='guest'){toast('Ещё партию начинает хост');return;} startGame(G.opts,null);};
$('#lobbyBtn').onclick=function(){cancelWait();curToken++;G.running=false;G.players=[];G.allCards=[];
 $('#gameover').classList.add('hidden');$('#cards').innerHTML='';els.clear();
 if(NET.mode!=='off')NET.leave();
 $('#lobby').classList.remove('hidden');};
$('#mFour').onchange=function(e){S.four=e.target.checked;saveS();
 els.forEach(function(el,id){el.querySelector('.face.front').innerHTML=faceSVG(cardById(id));});sync();};
$('#mFast').onchange=function(e){S.fast=e.target.checked;saveS();applySettings();};
$('#mLarge').onchange=function(e){S.large=e.target.checked;saveS();computeLayout();sync();};
$('#mAmb').oninput=function(e){S.volAmb=e.target.value/100;saveS();applySettings();};
$('#mCards').oninput=function(e){S.volCards=e.target.value/100;saveS();applySettings();};
$('#sortbtn').onclick=function(){if(!G.players.length)return;sortHand(G.players[0]);sync();AU.play('draw');};
addEventListener('resize',function(){computeLayout();
 document.body.classList.add('noanim');positionZones();sync();
 setTimeout(function(){document.body.classList.remove('noanim');},60);});
addEventListener('mousemove',function(e){
 var dx=(e.clientX/innerWidth-.5)*6,dy=(e.clientY/innerHeight-.5)*6;
 $('#bg').style.transform='translate('+(-dx)+'px,'+(-dy)+'px)';});
addEventListener('beforeunload',function(){if(NET.ws)NET.send({t:'leave'});});
function applySettings(){
 document.documentElement.style.setProperty('--dur',(S.fast?150:320)+'ms');
 if(AU.ctx&&AU.cardGain)AU.cardGain.gain.value=S.volCards;
 var m=$('#music');if(m)m.volume=musicVol();}
applySettings();
</script>
